# Builds and publishes the Windows installer the tills update from.
#
# WHERE THIS FILE RUNS
#   In the RELEASES repository (github.com/aalmaavventures/aalmaavbill-releases),
#   not next to the application source. The source of truth is GitLab
#   (gitlab.com/almaavventures/aalmaavbill); this job clones it, builds the
#   installer and publishes the result as a release of THIS repository. Installed
#   tills poll this repository anonymously, so it must stay public.
#
#   Because the job runs here, `github.repository_owner` and
#   `github.event.repository.name` below resolve to aalmaavventures /
#   aalmaavbill-releases, so the update link baked into the installer is the right
#   one without any repository name being hardcoded in this file.
#
#   The workflow is versioned with the application (inside aalmaav-bill-windows/)
#   and copied into the releases repository with:
#       cd aalmaav-bill-windows && npm run workflow:install -- --target=github-releases
#   Check the two copies for drift with:  npm run workflow:install -- --check
#
# PUBLISHING
#   Publishing is opt-in: a tag push publishes a release, a manual run publishes
#   only when the `publish` box is ticked. Any other build is an ordinary
#   installer with automatic updates deliberately left off.
#
#   The upload token is this job's own `secrets.GITHUB_TOKEN` (permission
#   `contents: write` below). scripts/release-win.js passes it to electron-builder
#   as GH_TOKEN/GITHUB_TOKEN; it is never written to a file the installer ships,
#   and `npm run verify` fails the build if a token ever appears in the baked
#   update configuration.
#
# CLONING THE SOURCE
#   Anonymous by default, which is why the GitLab project must stay public. If it
#   is ever made private, add GITLAB_DEPLOY_USER and GITLAB_DEPLOY_TOKEN (a
#   Project Deploy Token with only the read_repository scope) to THIS repository's
#   Actions secrets — the clone step below then authenticates without any other
#   change. Never put a credential in this file.

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (requires the GITHUB_TOKEN permission below)'
        type: boolean
        default: false
      source:
        description: 'GitLab branch or tag to build'
        type: string
        default: main
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The application source and where it is cloned inside the runner.
  GITLAB_REPO: https://gitlab.com/almaavventures/aalmaavbill.git
  SRC_DIR: src
  # A tag push publishes a release; a manual run publishes only when asked.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  # Which ref to build: the manual input, or the tag that was just pushed.
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.ref_name }}
  # The update link, in the same names a developer uses locally (.env or shell).
  # It is baked into the installer by `npm run stage`, so the built app checks
  # this repository's releases. The token is a CI secret and is never written
  # to any file the installer ships.
  AALMAAV_UPDATE_OWNER: ${{ github.repository_owner }}
  AALMAAV_UPDATE_REPO: ${{ github.event.repository.name }}
  AALMAAV_UPDATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out this repository (the workflow, not the application)
        uses: actions/checkout@v4

      - name: Clone the application source
        shell: pwsh
        env:
          # Empty unless a Project Deploy Token has been added to this
          # repository's secrets; without them the clone is anonymous.
          GITLAB_DEPLOY_USER: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
        run: |
          $gitArgs = @('-c', 'core.autocrlf=false', '-c', 'advice.detachedHead=false')
          if ($env:GITLAB_DEPLOY_USER -and $env:GITLAB_DEPLOY_TOKEN) {
            # Basic auth for git over HTTPS. The header is passed per invocation
            # and never stored in .git/config; the token only needs the
            # read_repository scope. No credential is written to any file.
            $pair = "$($env:GITLAB_DEPLOY_USER):$($env:GITLAB_DEPLOY_TOKEN)"
            $header = 'Authorization: Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair))
            $gitArgs += @('-c', "http.extraheader=$header")
            Write-Host 'cloning with a GitLab deploy token'
          } else {
            Write-Host 'cloning anonymously (the source repository is public)'
          }

          function Get-Source([string]$ref) {
            Remove-Item -Recurse -Force $env:SRC_DIR -ErrorAction SilentlyContinue
            Write-Host "cloning $env:GITLAB_REPO at '$ref'"
            & git @gitArgs clone --depth 1 --branch $ref $env:GITLAB_REPO $env:SRC_DIR
          }

          Get-Source $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) {
            if ($env:SOURCE_REF -eq 'main') { throw "cloning $env:GITLAB_REPO at '$env:SOURCE_REF' failed" }
            Write-Host "'$env:SOURCE_REF' is not in the source repository; falling back to main"
            Get-Source 'main'
            if ($LASTEXITCODE -ne 0) { throw "cloning $env:GITLAB_REPO failed" }
          }

          # Record exactly what was built, so a release can be tied back to a commit.
          $pkg = Get-Content "$env:SRC_DIR/aalmaav-bill-windows/package.json" -Raw | ConvertFrom-Json
          $sha = (& git -C $env:SRC_DIR rev-parse HEAD).Trim()
          "SOURCE_VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "source '$env:SOURCE_REF' at $sha, version $($pkg.version)"

          # A tag must claim the version it actually contains. This is what stops
          # a release being cut at a version the source never had.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expected = "v$($pkg.version)"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "tag $env:GITHUB_REF_NAME does not match package.json version $($pkg.version) (expected $expected)"
            }
          }

      # The bundled Node.js runtime and the staged native modules (better-sqlite3,
      # sharp, the Prisma schema engine) must be built for the same Node ABI.
      - name: Use Node.js 22 (matches the bundled runtime in scripts/fetch-node-runtime.js)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # These are resolved against the repository root, NOT against a step's
          # `working-directory`, and the application source is cloned into
          # SRC_DIR — so every entry starts with `src/`. Without it setup-node
          # cannot resolve any of the three lockfiles and fails the job before a
          # single dependency is installed.
          cache-dependency-path: |
            src/aalmaav-bill-windows/package-lock.json
            src/backend/package-lock.json
            src/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ${{ env.SRC_DIR }}/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ${{ env.SRC_DIR }}/frontend
        run: npm ci

      - name: Install desktop packaging dependencies
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm ci

      - name: Unit tests for the desktop shell
        id: desktop-tests
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        shell: pwsh
        run: |
          # This suite runs on Windows for the first time here. A failing test must
          # be readable by whoever is looking at the run, and the job log of a
          # public repository requires an account — so the output is kept as an
          # artifact (artifacts download anonymously) and re-thrown as the step's
          # own exit code.
          npm test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\desktop-tests.log"
          exit $LASTEXITCODE

      - name: Upload the desktop test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-log
          path: ${{ runner.temp }}/desktop-tests.log
          if-no-files-found: warn

      # The job log of a public repository needs an account to read, and so does an
      # uploaded artifact — both need read access to the repository, not just the
      # public feed. A check annotation does not, so the first failure is re-emitted
      # as one: whoever is looking at the run sees which test broke, and why, with
      # no credentials at all.
      - name: Report the first desktop test failure
        if: failure() && steps.desktop-tests.outcome == 'failure'
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\desktop-tests.log"
          if (-not (Test-Path $log)) { Write-Output 'no test log was written'; exit 0 }

          $lines = @(Get-Content $log)
          $failing = @($lines | Where-Object { $_ -like 'not ok *' })
          Write-Output "test log: $($lines.Count) lines, $($failing.Count) failing test(s)"

          if ($failing.Count -eq 0) {
            Write-Output '::error title=Desktop shell tests failed::the log has no failing test ("not ok") — the suite itself did not start'
            exit 0
          }

          # One annotation per failing test, so a run with several failures names
          # them all instead of only the first.
          foreach ($line in ($failing | Select-Object -First 10)) {
            Write-Output "::error title=Desktop shell test failed::$($line -replace '%', '%25')"
          }

          # ...and the first one's diagnostic block, which is where the assertion
          # says what it actually got.
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -like 'not ok *') { $start = $i; break }
          }
          $end = [Math]::Min($start + 20, $lines.Count - 1)
          $excerpt = ($lines[$start..$end] -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
          Write-Output "::error title=First desktop test failure (detail)::$excerpt"

      # Refuse to publish a version that is already published, or older than the
      # published one, or parked on someone else's release. Read-only: it reads the
      # public GitHub API anonymously, exactly as an installed till does.
      - name: Pre-flight checks on the release feed
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run verify:feed -- --phase=pre --version ${{ env.SOURCE_VERSION }}

      - name: Stage the runtime (backend, built frontend, bundled Node.js, licences)
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run stage -- --target win32 --arch x64

      - name: Verify the staged tree and the installer configuration
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run verify -- --strict --target win32

      # The release is created HERE, as a draft, before anything is built. Two
      # reasons, and the first real publish produced both:
      #   * electron-builder creates the release once per publisher instance, and two
      #     of them racing produced TWO releases for v1.2.0 — the installer and
      #     latest.yml on one record, the blockmap on the other, which is exactly what
      #     the post-publish guard then failed on. With the release already in place,
      #     every upload attaches to it instead of creating its own.
      #   * a draft is invisible to anonymous readers and every till is anonymous, so
      #     a half-uploaded release cannot be seen — or downloaded — by a shop.
      # This makes nothing visible: the promote step below is what does that.
      - name: Prepare the release (a draft no till can see)
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run release:prepare -- --version ${{ env.SOURCE_VERSION }} --source "GitLab ${{ env.SOURCE_SHA }}"

      - name: Build the NSIS installer (and publish when this is a release)
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        shell: pwsh
        run: |
          if ($env:PUBLISH -eq 'true') {
            # The same script a developer runs; the update link comes from the
            # AALMAAV_UPDATE_* environment defined for this job. It hands the token
            # to electron-builder as GH_TOKEN — the step that actually uploads.
            npm run release:win -- --skip-stage
          } else {
            npx electron-builder --win nsis --x64 --publish never
          }

      - name: Verify the installer exists
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        shell: pwsh
        run: |
          $found = @(Get-ChildItem 'dist/AalmaavBill-Setup-*.exe' -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) { throw "expected one dist/AalmaavBill-Setup-<version>.exe, found $($found.Count)" }
          $found | Select-Object Name, Length, LastWriteTime
          Get-FileHash $found[0].FullName -Algorithm SHA256

      # The one moment the feed changes: the draft becomes a release, and only now
      # that the installer, its blockmap and latest.yml are all attached and the
      # installer has been checked. Until this step runs, a till sees the previous
      # version and nothing else — which is what makes a failed build harmless.
      - name: Publish the release (the feed changes here)
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run release:promote -- --version ${{ env.SOURCE_VERSION }}

      # Read the published feed back the way a till does: anonymously, with no
      # token, and compare it against the files just built. A version that is not
      # reachable here would be stranded.
      - name: Verify the published release feed (anonymous)
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run verify:feed -- --phase=post --version ${{ env.SOURCE_VERSION }}

      # A failed run leaves the draft behind. The next attempt for this version
      # clears it (prepare does exactly that), but a person reading the releases page
      # should see either a published version or nothing at all. A published release
      # is never touched here: a till may already have it.
      - name: Discard the draft a failed run left behind
        if: failure() && env.PUBLISH == 'true'
        working-directory: ${{ env.SRC_DIR }}/aalmaav-bill-windows
        run: npm run release:discard -- --version ${{ env.SOURCE_VERSION }}

      - name: Upload the installer as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AalmaavBill-Setup-${{ env.SOURCE_VERSION }}
          path: |
            src/aalmaav-bill-windows/dist/AalmaavBill-Setup-*.exe
            src/aalmaav-bill-windows/dist/latest.yml
            src/aalmaav-bill-windows/dist/*.blockmap
          if-no-files-found: error
